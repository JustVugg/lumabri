  linux-arm64-build:
    # Native ARM64 execution with the older glibc floor. This is not a
    # physical Raspberry Pi or multi-machine cluster certification.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: lumabri
      - uses: actions/checkout@v4
        with:
          repository: JustVugg/colibri
          ref: ce370e87d7b623d7759b52ec2007d75fc5b0e87e
          path: colibri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native architecture and build portable CPU runtime
        working-directory: lumabri
        run: |
          test "$(uname -m)" = aarch64
          make household swarm_probe test_machine test_process_memory test_engine_memory test_engine_memory_guard test_memlock test_calibration test_backend_routes test_segment_close test_chat_ui test_hosted_sessions ENGINE=../colibri/c CFLAGS='-O2 -Wall -Wextra -Werror' -j2
          ./test_machine
          ./test_process_memory
          ./test_engine_memory
          ./test_engine_memory_guard
          ./test_memlock
          ./test_calibration
          ./test_backend_routes
          ./test_segment_close
      - name: Preserve the native executables for the fixture job
        working-directory: lumabri
        run: |
          python3 - <<'PYCODE'
          import runpy, tarfile
          binaries=runpy.run_path('tools/package_household.py')['BINARIES']
          with tarfile.open('build/arm64-executables.tar.gz','w:gz') as archive:
              for name in (*binaries,'liblumabri.so','test_chat_ui','test_hosted_sessions'):
                  archive.add(name,arcname=name)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-executables
          path: lumabri/build/arm64-executables.tar.gz
          retention-days: 1

  linux-arm64-household:
    # Native ARM64 execution with the older glibc floor. This is not a
    # physical Raspberry Pi or multi-machine cluster certification.
    needs: [linux, linux-arm64-build]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: lumabri
      - uses: actions/checkout@v4
        with:
          repository: JustVugg/colibri
          ref: ce370e87d7b623d7759b52ec2007d75fc5b0e87e
          path: colibri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-executables
          path: lumabri/build
      - name: Use the exact executables from the native build gate
        working-directory: lumabri
        run: |
          test "$(uname -m)" = aarch64
          tar -xzf build/arm64-executables.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: tiny-*-checkpoint
          path: lumabri/build/arm64-fixtures
      - name: Arrange the exact fixture bytes from the Linux oracle job
        working-directory: lumabri
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('build/arm64-fixtures')
          for family in ('olmoe','qwen36','inkling','kimi','glm','glm53','qwen38','qwen38-fp8','v4'):
              target=Path('build/arm64-models')/family/(family+'-tiny')
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copytree(root/('tiny-'+family+'-checkpoint'),target)
          shutil.copytree(root/'tiny-v41-boundary-checkpoint',Path('build/v41-tiny'))
          PY
      - name: Native adapter and resident household execution
        working-directory: lumabri
        env:
          LUMABRI_RESIDENT_REQUIRED: '1'
          LUMABRI_RESIDENCY_POLICY: engine-locked
        run: |
          # Only this disposable test shell and its children receive the
          # allowance. No system-wide swap/locking settings are changed.
          sudo prlimit --pid $$ --memlock=12884901888:12884901888
          python3 - <<'PY'
          import subprocess
          cases=[('olmoe',[]),('qwen36',[]),('inkling',[]),
                 ('kimi',['--donor-ram-gb','4.5']),('glm',[]),('glm53',[]),
                 ('qwen38',['--context','512','--expect-greedy']),
                 ('qwen38-fp8',['--context','512','--expect-greedy']),
                 ('v4',['--donor-ram-gb','1.0'])]
          for family,extra in cases:
              subprocess.run(['python3','tests/integration/home_flow_test.py',
                  '--models-dir','build/arm64-models/'+family,'--expect-metrics',*extra],check=True)
          PY
          make test-v41-range-existing test-v41-transport-existing test-v41-abi-existing test-v41-memory-existing ENGINE=../colibri/c CFLAGS='-O2 -Wall -Wextra -Werror'
      - name: Validate installed ARM64 package and two co-resident models
        working-directory: lumabri
        env:
          LUMABRI_RESIDENCY_POLICY: engine-locked
        run: |
          sudo prlimit --pid $$ --memlock=12884901888:12884901888
          python3 tools/package_household.py --colibri-root ../colibri --output 'build/native arm64 candidate'
          python3 tests/integration/household_doctor_test.py --runtime-dir 'build/native arm64 candidate/bin'
          python3 tests/integration/household_service_flow_test.py --installed-package 'build/native arm64 candidate' --models-dir build/arm64-models/olmoe --joint complete --api-prepare --donor-ram-gb 1.5 --sessions 2
          python3 tests/integration/home_flow_test.py --runtime-dir 'build/native arm64 candidate/bin' --models-dir build/arm64-models/olmoe --kill-donor
          python3 tools/package_household.py --verify 'build/native arm64 candidate'
          tar -czf build/lumabri-linux-arm64-candidate.tar.gz -C 'build/native arm64 candidate' .
      - uses: actions/upload-artifact@v4
        with:
          name: household-candidate-linux-arm64
          path: lumabri/build/lumabri-linux-arm64-candidate.tar.gz
          retention-days: 7
      - name: Retain native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-failure-diagnostics
          path: |
            /tmp/lmb-service-flow-*/**/*.log
            /tmp/lumabri-home-flow-*/**/*.log
          include-hidden-files: true
          retention-days: 3

  macos-household:
    # Real native CPU engines + signed CAS + approvals + streaming. Loopback
    # coverage does not replace the macOS 12.6 / physical household LAN test.
    needs: linux
    env:
      # A native macOS 15 test is not a macOS 12 test, but do not ship a binary
      # whose load commands already forbid the user's macOS 12.6 machine.
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
        openmp: [enabled, disabled]
    runs-on: ${{ matrix.runner }}
    # The real elastic gate includes a complete demand window and idle grace
    # for both scale-downs, plus the two-portfolio comparison. Keep production
    # timers and inference rather than replacing them with fake test time.
    # Include the independently built older native package and all-service
    # update/rollback, not only the short same-package acceptance run.
    timeout-minutes: 65
    steps:
      # runner.temp is available to steps, not job-level env expressions.
      # Keep all household logs where the failure artifact collects them.
      - name: Set the household test temporary directory
        shell: bash
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: lumabri
      - uses: actions/checkout@v4
        with:
          repository: JustVugg/colibri
          ref: ce370e87d7b623d7759b52ec2007d75fc5b0e87e
          path: colibri
      - name: Checkout the explicit whole-service update baseline
        uses: actions/checkout@v4
        with:
          repository: JustVugg/lumabri
          ref: 027b55b1371116b0a289922abb2b2e9bbd8474c7
          path: previous-lumabri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        if: matrix.openmp == 'enabled'
        with:
          repository: llvm/llvm-project
          ref: 87f0227cb60147a26a1eeb4fb06e3b505e9c7261
          path: llvm-openmp
          sparse-checkout: |
            openmp
            cmake
            llvm/cmake
      - name: Build relocatable OpenMP for the supported macOS floor
        if: matrix.openmp == 'enabled'
        run: |
          python3 lumabri/tools/build_macos_openmp.py --source llvm-openmp --build "$RUNNER_TEMP/openmp-build" --prefix "$RUNNER_TEMP/openmp-install"
          printf 'OMP_PREFIX=%s\n' "$RUNNER_TEMP/openmp-install" >> "$GITHUB_ENV"
      - name: Build the native household runtime
        working-directory: lumabri
        env:
          OPENMP_MODE: ${{ matrix.openmp }}
        run: |
          if [ "$OPENMP_MODE" = disabled ]; then
            make household test_backend_routes ENGINE=../colibri/c CC=clang OMP_FLAGS= OMP_LIBS= -j3
            test "$(./segment_node --thread-capacity)" = 1
          else
            make household test_backend_routes ENGINE=../colibri/c CC=clang -j3
          fi
      - uses: actions/download-artifact@v4
        with:
          name: tiny-olmoe-checkpoint
          path: lumabri/build/home-flow-models/olmoe-tiny
      - uses: actions/download-artifact@v4
        with:
          name: tiny-v41-boundary-checkpoint
          path: lumabri/build/v41-tiny
      - name: V4.1 range boundary oracle on native macOS
        working-directory: lumabri
        env:
          OPENMP_MODE: ${{ matrix.openmp }}
        run: |
          if [ "$OPENMP_MODE" = disabled ]; then
            make test-v41-range-existing test-v41-transport-existing test-v41-abi-existing test-v41-memory-existing ENGINE=../colibri/c CC=clang OMP_FLAGS= OMP_LIBS=
          else
            make test-v41-range-existing test-v41-transport-existing test-v41-abi-existing test-v41-memory-existing ENGINE=../colibri/c CC=clang
          fi
          python3 tests/integration/v41_product_test.py
      - name: Request, accept, fetch weights and chat on native macOS
        working-directory: lumabri
        run: |
          python3 tests/integration/owned_engine_process_test.py
          python3 tests/integration/managed_soak_summary_test.py
          python3 tests/integration/installed_gateway_contract_test.py
          python3 tests/integration/installed_managed_contract_test.py
          python3 tests/integration/installed_fleet_contract_test.py
          ./test_backend_routes
          make test_segment_close ENGINE=../colibri/c
          ./test_segment_close
          python3 tests/integration/backend_policy_test.py
          test "$(OMP_NUM_THREADS=1 ./segment_node --thread-capacity)" = 1
          test "$(OMP_NUM_THREADS=4 OMP_THREAD_LIMIT=1 ./segment_node --thread-capacity)" = 1
          python3 tests/integration/segment_physical_budget_test.py
          make swarm_probe
          python3 tests/integration/household_doctor_test.py
          make test_chat_ui
          make test_hosted_sessions
          python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --keep-requester --sessions 2
          LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --keep-requester --multi-model --sessions 2
          python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models
          (
            mv segment_chat segment_chat.real
            trap 'mv -f segment_chat.real segment_chat' EXIT
            python3 tests/integration/recovery_proxy_install_test.py
            python3 tests/integration/recovery_codec_proxy.py --install segment_chat
            # Exercise persistent replicas with actual payload locks. The
            # observation-only compression guard remains independently tested.
            LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --keep-requester --multi-model --sessions 4 --api --replicas --recovery --portfolio-policy
          )
          # Idle resident models need owned-payload locks, not a hope that
          # macOS never compresses an observation-only process on this runner.
          # The joint flow verifies effective locks; no residency guard is disabled.
          LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint complete --donor-ram-gb 1 --sessions 2
          LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint complete --api-prepare --donor-ram-gb 1 --sessions 2
          LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint complete --api-prepare --donor-policy --donor-ram-gb 1.5 --sessions 2 --elastic
          LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint complete --api-prepare --donor-ram-gb 2 --sessions 2 --placement-comparison
          LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint complete --api-prepare --donor-ram-gb 1.5 --sessions 2 --soak-seconds 10
          LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint complete --api-prepare --headless-donors --donor-ram-gb 1.5 --sessions 2
          python3 tests/integration/home_flow_test.py --models-dir build/home-flow-models --repeat-cached --clear-cached --expect-metrics --expect-calibration
          python3 tests/integration/home_flow_test.py --models-dir build/home-flow-models --kill-donor
          python3 tests/integration/home_flow_test.py --models-dir build/home-flow-models --expect-selected-no-fit
      - uses: actions/download-artifact@v4
        with:
          name: tiny-qwen36-checkpoint
          path: lumabri/build/qwen-home-models/qwen36-tiny
      - name: Native Qwen grouped-int4 request and execution
        working-directory: lumabri
        run: python3 tests/integration/home_flow_test.py --models-dir build/qwen-home-models
      - uses: actions/download-artifact@v4
        with:
          name: tiny-inkling-checkpoint
          path: lumabri/build/inkling-home-models/inkling-tiny
      - name: Native Inkling packed-int4 request and execution
        working-directory: lumabri
        run: python3 tests/integration/home_flow_test.py --models-dir build/inkling-home-models
      - uses: actions/download-artifact@v4
        with:
          name: tiny-kimi-checkpoint
          path: lumabri/build/kimi-home-models/kimi-tiny
      - name: Native Kimi insufficient-memory admission
        working-directory: lumabri
        run: python3 tests/integration/home_flow_test.py --models-dir build/kimi-home-models --expect-no-fit
      # The standard ARM runner cannot provide two native Kimi 3.7 GB floors.
      # Exercise refusal there; do not override the engine's RAM safeguard.
      - name: Native Kimi MXFP4 execution on sufficient-memory runner
        if: matrix.runner == 'macos-15-intel'
        working-directory: lumabri
        run: python3 tests/integration/home_flow_test.py --models-dir build/kimi-home-models --donor-ram-gb 4.5
      - uses: actions/download-artifact@v4
        with:
          name: tiny-glm-checkpoint
          path: lumabri/build/glm-home-models/glm_tiny
      - name: Native GLM request and execution
        working-directory: lumabri
        run: python3 tests/integration/home_flow_test.py --models-dir build/glm-home-models
      - uses: actions/download-artifact@v4
        with:
          name: tiny-glm53-checkpoint
          path: lumabri/build/glm53-home-models/glm53-tiny
      - name: Native GLM5.3 request and execution
        working-directory: lumabri
        run: python3 tests/integration/home_flow_test.py --models-dir build/glm53-home-models
      - uses: actions/download-artifact@v4
        with:
          name: tiny-qwen38-checkpoint
          path: lumabri/build/qwen38-home-models/qwen38-tiny
      - name: Native Qwen3.8 request and execution
        working-directory: lumabri
        run: python3 tests/integration/home_flow_test.py --models-dir build/qwen38-home-models --context 512 --expect-greedy
      - uses: actions/download-artifact@v4
        with:
          name: tiny-qwen38-fp8-checkpoint
          path: lumabri/build/qwen38-fp8-home-models/qwen38-tiny
      - name: Native Qwen3.8 FP8 request and execution
        working-directory: lumabri
        run: python3 tests/integration/home_flow_test.py --models-dir build/qwen38-fp8-home-models --context 512 --expect-greedy --expect-metrics
      - uses: actions/download-artifact@v4
        with:
          name: tiny-v4-checkpoint
          path: lumabri/build/v4-home-models/deepseek-v4-tiny
      - name: Native V4 request and execution
        working-directory: lumabri
        run: python3 tests/integration/home_flow_test.py --models-dir build/v4-home-models --donor-ram-gb 1.0
      - name: Native resident RAM — retain weights after chat, then release on owner Stop
        working-directory: lumabri
        env:
          LUMABRI_RESIDENT_REQUIRED: '1'
        run: |
          make test-home-monitor
          make test_home_expert ENGINE=../colibri/c
          ./test_home_expert
          python3 tests/integration/home_flow_output_test.py
          python3 tests/integration/home_flow_test.py --models-dir build/home-flow-models --resident-default --stall-preparation-ui --expect-metrics
          python3 tests/integration/home_flow_test.py --models-dir build/home-flow-models --expect-metrics --crash-requester --resident-default
          python3 tests/integration/home_flow_test.py --models-dir build/home-flow-models --resident-default --kill-donor
          python3 tests/integration/home_flow_test.py --models-dir build/qwen-home-models --expect-metrics
          python3 tests/integration/home_flow_test.py --models-dir build/inkling-home-models --expect-metrics
          python3 tests/integration/home_flow_test.py --models-dir build/glm-home-models --expect-metrics
          python3 tests/integration/home_flow_test.py --models-dir build/glm53-home-models --expect-metrics
          python3 tests/integration/home_flow_test.py --models-dir build/qwen38-home-models --context 512 --expect-greedy --expect-metrics
          python3 tests/integration/home_flow_test.py --models-dir build/qwen38-fp8-home-models --context 512 --expect-greedy --expect-metrics
          python3 tests/integration/home_flow_test.py --models-dir build/v4-home-models --donor-ram-gb 1.0 --expect-metrics
      - name: Native resident Kimi on sufficient-memory runner
        if: matrix.runner == 'macos-15-intel'
        working-directory: lumabri
        env:
          LUMABRI_RESIDENT_REQUIRED: '1'
        run: python3 tests/integration/home_flow_test.py --models-dir build/kimi-home-models --donor-ram-gb 4.5 --expect-metrics
      - name: Assemble and test the relocated native macOS candidate
        working-directory: lumabri
        env:
          OPENMP_MODE: ${{ matrix.openmp }}
        run: |
          if [ "$OPENMP_MODE" = enabled ]; then
            python3 tools/package_household.py --colibri-root ../colibri --openmp-prefix "$OMP_PREFIX" --output 'build/native candidate'
            test "$(OMP_NUM_THREADS=2 'build/native candidate/bin/segment_node' --thread-capacity)" = 2
          else
            python3 tools/package_household.py --colibri-root ../colibri --output 'build/native candidate'
            test "$('build/native candidate/bin/segment_node' --thread-capacity)" = 1
          fi
          python3 tests/integration/household_doctor_test.py --runtime-dir 'build/native candidate/bin'
          python3 tests/integration/home_flow_test.py --runtime-dir 'build/native candidate/bin' --models-dir build/home-flow-models --resident-default --expect-metrics
          LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --installed-package 'build/native candidate' --models-dir build/home-flow-models --joint complete --api-prepare --donor-ram-gb 1.5 --sessions 2
          python3 tests/integration/home_flow_test.py --runtime-dir 'build/native candidate/bin' --models-dir build/home-flow-models --resident-default --expect-hybrid --expect-metrics
          python3 tests/integration/home_flow_test.py --runtime-dir 'build/native candidate/bin' --models-dir build/home-flow-models --resident-default --expect-hybrid --expect-hybrid-fanout --expect-metrics
          python3 tests/integration/home_flow_test.py --runtime-dir 'build/native candidate/bin' --models-dir build/home-flow-models --repeat-cached --clear-cached --expect-metrics --expect-calibration
          python3 tests/integration/home_flow_test.py --runtime-dir 'build/native candidate/bin' --models-dir build/home-flow-models --kill-donor
          python3 tests/integration/home_flow_test.py --runtime-dir 'build/native candidate/bin' --models-dir build/home-flow-models --expect-disjoint-plans --context 256
          python3 tests/integration/home_flow_test.py --runtime-dir 'build/native candidate/bin' --models-dir build/home-flow-models --expect-quick-calibration
          if [ "$OPENMP_MODE" = enabled ]; then
            make -C ../previous-lumabri household swarm_probe ENGINE="$GITHUB_WORKSPACE/colibri/c" CC=clang -j2
            python3 ../previous-lumabri/tools/package_household.py --colibri-root ../colibri --openmp-prefix "$OMP_PREFIX" --output 'build/previous candidate'
          else
            make -C ../previous-lumabri household swarm_probe ENGINE="$GITHUB_WORKSPACE/colibri/c" CC=clang OMP_FLAGS= OMP_LIBS= -j2
            python3 ../previous-lumabri/tools/package_household.py --colibri-root ../colibri --output 'build/previous candidate'
          fi
          python3 tests/integration/installed_fleet_update_test.py --previous-package 'build/previous candidate' --candidate-package 'build/native candidate' --models-dir build/home-flow-models
          python3 tools/package_household.py --verify 'build/native candidate'
          tar -czf build/lumabri-macos-candidate.tar.gz -C 'build/native candidate' .
      - uses: actions/upload-artifact@v4
        with:
          name: household-candidate-${{ matrix.runner }}-${{ matrix.openmp }}
          path: lumabri/build/lumabri-macos-candidate.tar.gz
          retention-days: 7
      - name: Keep the declared-cost comparison report (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-comparison-${{ matrix.runner }}-${{ matrix.openmp }}
          path: |
            ${{ runner.temp }}/lmb-service-flow-*/placement-comparison.json
            ${{ runner.temp }}/lmb-service-flow-*/managed-soak.json
            ${{ runner.temp }}/lmb-service-flow-*/installed-managed.json
            ${{ runner.temp }}/lmb-installed-fleet-*/installed-fleet-update.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: household-logs-${{ matrix.runner }}-${{ matrix.openmp }}
          path: |
            ${{ runner.temp }}/lumabri-home-flow-*/**/*.log
            ${{ runner.temp }}/lmb-service-flow-*/**/*.log
            ${{ runner.temp }}/lmb-installed-fleet-*/**/*.log
          include-hidden-files: true
          retention-days: 3
