name: Lumabri CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-workspace:
    # Native frontend gate, not certification of Segment, GPU or a real LAN.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the C workspace with Apple Clang
        run: make lumabri test_chat_ui CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
      - name: Readiness descriptors and portable fallback
        run: make test-ready-pipe CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
      - name: Native cryptographic known-answer tests
        run: bash tests/integration/crypto_test.sh
      - name: Native workspace navigation and terminal restoration
        run: python3 tests/integration/workspace_navigation_test.py
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Lumabri
        uses: actions/checkout@v4
        with:
          path: lumabri
      - name: Checkout Colibri dev
        uses: actions/checkout@v4
        with:
          repository: JustVugg/colibri
          ref: dev
          path: colibri
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lumabri/requirements-test.txt
      - name: Install test dependencies
        working-directory: lumabri
        run: python -m pip install --requirement requirements-test.txt
      - name: Engine hook anchors still match upstream
        working-directory: lumabri
        run: python3 engine_patches/make_patches.py --engine-dir ../colibri/c --check-anchors
      - name: Warning gate
        working-directory: lumabri
        run: make check-warnings ENGINE=../colibri/c
      - name: Unit and integration gates
        working-directory: lumabri
        run: make test ENGINE=../colibri/c
      - name: Sanitizers
        working-directory: lumabri
        run: make test-sanitize
      - name: Resident Segment Hybrid gate
        working-directory: lumabri
        run: make test-segment-hybrid ENGINE=../colibri/c
      - name: Segment failover gate (fresh fencing, checkpoint replay)
        working-directory: colibri/c
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install safetensors huggingface_hub transformers
          make segment-edge-library -j"$(nproc)"
          python3 tools/make_olmoe_tiny.py --output olmoe_tiny_src --force
          python3 tools/make_edge_tiny_tokenizer.py olmoe_tiny_src --vocab-size 128
          python3 tools/convert_olmoe_merged.py --model olmoe_tiny_src --out olmoe_tiny_merged --min-free-gb 0
      - name: Segment failover gate — run
        working-directory: lumabri
        run: |
          make tracker segment_node segment_chat ENGINE=../colibri/c -j"$(nproc)"
          OLMOE_EDGE_MODEL=../colibri/c/olmoe_tiny_merged \
          SEGMENT_NODE_BIN=./segment_node SEGMENT_CHAT_BIN=./segment_chat \
            bash ./tests/integration/segment_failover_test.sh
          OLMOE_EDGE_MODEL=../colibri/c/olmoe_tiny_merged \
          SEGMENT_NODE_BIN=./segment_node SEGMENT_CHAT_BIN=./segment_chat \
            bash ./tests/integration/segment_priority_test.sh
