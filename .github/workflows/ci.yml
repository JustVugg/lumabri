name: Lumabri CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A stacked PR may receive both a base update and a head update. Test the
  # latest revision once, instead of running duplicate native matrices.
  group: lumabri-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kubernetes-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the optional C controller and verify TLS/API contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config
          make test-kubernetes CFLAGS='-O2 -Wall -Wextra -Werror'
      - name: Real Kubernetes admission, RBAC, status and finalizer
        run: sh tools/ci_kubernetes_control.sh
      - name: Build the optional controller container from the restricted context
        run: |
          docker build --file deploy/kubernetes/Dockerfile.controller --tag lumabri-controller-ci .
          docker run --rm lumabri-controller-ci --help
  kubernetes-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lumabri
    steps:
      - uses: actions/checkout@v4
        with:
          path: lumabri
      - uses: actions/checkout@v4
        with:
          repository: JustVugg/colibri
          ref: ce370e87d7b623d7759b52ec2007d75fc5b0e87e
          path: colibri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the native candidate and reduced fixture from pinned sources
        run: |
          make household swarm_probe ENGINE=../colibri/c -j2
          python3 tools/package_household.py --colibri-root ../colibri --output build/container-candidate
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python3 -m pip install safetensors huggingface_hub transformers
          python3 ../colibri/c/tools/make_olmoe_tiny.py --output build/container-fixture-source --force
          python3 ../colibri/c/tools/make_edge_tiny_tokenizer.py build/container-fixture-source --vocab-size 128
          python3 ../colibri/c/tools/convert_olmoe_merged.py --model build/container-fixture-source --out build/container-fixture --min-free-gb 0
      - name: Build only the verified native candidate into the runtime image
        run: |
          python3 tools/prepare_container_context.py --package build/container-candidate --output build/container-context
          docker build --tag lumabri-resident-ci build/container-context
          docker run --rm lumabri-resident-ci machine --json
      - name: Add reduced models and a driver only to the disposable test image
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil
          source = Path('build/container-fixture')
          assert (source / 'config.json').is_file()
          assert sum(p.stat().st_size for p in source.rglob('*') if p.is_file()) < 32 << 20
          target = Path('build/container-test')
          for name in ('model-a', 'model-b'):
              shutil.copytree(source, target / 'fixtures' / name)
          config = target / 'fixtures/model-b/config.json'
          body = json.loads(config.read_text())
          body['_lumabri_test_variant'] = 'separate-kubernetes-pods'
          config.write_text(json.dumps(body))
          (target / 'Dockerfile').write_text('FROM lumabri-resident-ci\nUSER root\nRUN apt-get update && apt-get install --no-install-recommends -y python3 && rm -rf /var/lib/apt/lists/*\nCOPY --chown=10001:10001 fixtures /fixtures\nUSER 10001:10001\n')
          PY
          docker build --tag lumabri-resident-test:ci build/container-test
      - name: Real resident engines in separate Kubernetes worker Pods
        run: KUBE_WORKER_TEST_IMAGE=lumabri-resident-test:ci sh tools/ci_kubernetes_workers.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubernetes-resident-evidence
          path: |
            lumabri/build/kubernetes-workers.json
            lumabri/build/container-candidate/manifest.json
  windows-network-helper:
    # Validate the permission helper without changing runner firewall rules.
    # This does not certify a native Windows model runtime.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and dry-run private-LAN permission changes
        shell: powershell
        run: |
          & ./tools/setup-household-firewall.ps1 -Subnet 192.168.1.0/24 -WhatIf
          & ./tools/setup-household-firewall.ps1 -Subnet 192.168.1.0/24 -Remove -WhatIf
          $rejected = $false
          try { & ./tools/setup-household-firewall.ps1 -Subnet 0.0.0.0/0 -WhatIf }
          catch { $rejected = $true }
          if (-not $rejected) { throw 'An unrestricted network was accepted' }
      - name: Execute create, update and remove against strict command doubles
        shell: powershell
        run: ./tests/integration/firewall_helper_test.ps1
      - name: Verify native Windows process memory observations
        shell: powershell
        run: ./tools/ci_windows_process_memory.ps1
  macos-workspace:
    # Native frontend gate, not certification of Segment, GPU or a real LAN.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the C workspace with Apple Clang
        run: |
          make lumabri tracker maintainer swarm_probe liblumabri.dylib test_shim test_machine test_chat_ui test_memory_budget test_planner test_cluster test_calibration test_inventory test_weight_cache CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_machine
          make test-agent-control CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          make test-container-limits CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          make test_process_memory CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_process_memory
          make test_engine_memory test_engine_memory_guard test_memlock CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_engine_memory
          ./test_engine_memory_guard
          ./test_memlock
          python3 tests/integration/engine_memory_boundary_test.py
          make test_serve_control CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_serve_control
          make test_host_session_pool test_host_drain test_node_control CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_host_session_pool
          ./test_host_drain
          ./test_node_control
          make test_run_gate CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_run_gate
          make test_api_access test_replica_admission test_retired_receipts test_allocation_lifetime test_journal_index test_tracker_history CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_api_access
          ./test_replica_admission
          ./test_retired_receipts
          ./test_allocation_lifetime
          ./test_journal_index
          ./test_tracker_history
          make test_compute_broker CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_compute_broker
          make test_portfolio CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_portfolio
          ./test_chat_ui service-codec
          ./test_chat_ui home-settings
          python3 tests/integration/test_prerequisites_test.py
          ./test_chat_ui donor-policy-codec
          ./test_chat_ui host-codec
          ./test_chat_ui resident-plan
          python3 tests/integration/household_service_test.py
          ./test_chat_ui prepare-progress
          make test_tcp_latency CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_tcp_latency
          make test_hybrid_parallel CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_hybrid_parallel
          ./test_memory_budget
          ./test_weight_cache
          python3 tests/integration/storage_ui_test.py
          ./test_planner
          make test_planner_io CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_planner_io
          ./test_cluster
          ./test_calibration
          make test_reply_stream CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_reply_stream
          make test_metrics CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_metrics
          make test-api CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          python3 tests/integration/api_gateway_test.py
          python3 tests/integration/api_service_test.py
          python3 tests/integration/api_proxy_test.py
          python3 tests/integration/chat_history_test.py
          make test-chat-history CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_chat_ui api-codec
          ./test_chat_ui preparation-observe
          ./test_chat_ui elastic-json
          ./test_chat_ui demand-codec
          ./test_chat_ui reply-errors
          make test_catalogue_advice CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          ./test_catalogue_advice
          ./test_inventory
          make test-runtime-probe CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
          python3 tests/integration/native_shim_readiness_test.py
          python3 tests/integration/native_shim_test.py
          python3 tests/integration/household_network_test.py
      - name: Readiness descriptors and portable fallback
        run: make test-ready-pipe CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
      - name: Native cryptographic known-answer tests
        run: bash tests/integration/crypto_test.sh
      - name: Household ports, discovery parser and terminal palettes
        run: make test-home-network CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
      - name: Encrypted donor authentication and offer admission
        run: make test-home-monitor CC=clang CFLAGS='-O2 -Wall -Wextra -Werror'
      - name: Native workspace navigation and terminal restoration
        run: python3 tests/integration/workspace_navigation_test.py
      - name: Native candidate packaging contracts
        run: |
          python3 tests/integration/prepare_engine_source_test.py
          python3 tests/integration/package_household_test.py
          python3 tests/integration/preload_path_test.py
  linux:
    runs-on: ubuntu-24.04
    # Real multi-model/recovery and installed-layout gates take 40–45 minutes
    # on current runners. Also build a clean baseline package for the full
    # previous -> candidate -> previous service gate; retain bounded margin.
    timeout-minutes: 75
    steps:
      - name: Checkout Lumabri
        uses: actions/checkout@v4
        with:
          path: lumabri
      - name: Checkout Colibri v1.12.1
        uses: actions/checkout@v4
        with:
          repository: JustVugg/colibri
          ref: ce370e87d7b623d7759b52ec2007d75fc5b0e87e
          path: colibri
      - name: Checkout the explicit whole-service update baseline
        uses: actions/checkout@v4
        with:
          repository: JustVugg/lumabri
          ref: 027b55b1371116b0a289922abb2b2e9bbd8474c7
          path: previous-lumabri
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lumabri/requirements-test.txt
      - name: Install test dependencies
        working-directory: lumabri
        run: |
          python -m pip install --requirement requirements-test.txt
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config
          make lumabri-kube CFLAGS='-O2 -Wall -Wextra -Werror'
      - name: Extract isolated HTTPS proxy for local tests
        run: |
          sudo apt-get update
          NGINX_TEST_ROOT="$(mktemp -d "$RUNNER_TEMP/lumabri-nginx.XXXXXX")"
          cd "$NGINX_TEST_ROOT"
          apt-get download nginx
          dpkg-deb -x nginx_*.deb root
          echo "LUMABRI_TEST_NGINX=$NGINX_TEST_ROOT/root/usr/sbin/nginx" >> "$GITHUB_ENV"
      - name: Engine hook anchors still match upstream
        working-directory: lumabri
        run: |
          python3 engine_patches/make_patches.py --engine-dir ../colibri/c --check-anchors
          python3 tests/integration/engine_patch_test.py --engine ../colibri/c
          python3 tests/integration/qwen_edge_oracle_test.py
      - name: Warning gate
        working-directory: lumabri
        run: make check-warnings ENGINE=../colibri/c
      - name: Unit and integration gates
        working-directory: lumabri
        run: |
          make test ENGINE=../colibri/c
          python3 tests/integration/api_https_test.py --nginx "$LUMABRI_TEST_NGINX"
          make test-runtime-probe CFLAGS='-O2 -Wall -Wextra -Werror'
      - name: Native container resource boundary
        working-directory: lumabri
        run: |
          make build/tests/probe-container-budget CFLAGS='-O2 -Wall -Wextra -Werror'
          sudo systemd-run --scope --unit=lumabri-ci-resource-probe -p MemoryMax=512M -p CPUQuota=100% "$PWD/build/tests/probe-container-budget"
      - name: Sanitizers
        working-directory: lumabri
        run: make test-sanitize
      - name: Compiled web chat — browser and private history
        working-directory: lumabri
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python3 tests/integration/web_chat_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-chat-evidence
          path: lumabri/build/web-chat-artifacts
      - name: Resident Segment Hybrid gate
        working-directory: lumabri
        run: |
          make test-segment-hybrid test_home_expert build/bench_home_hybrid ENGINE=../colibri/c
          ./test_home_expert
          ./build/bench_home_hybrid --numeric-reference-selftest
          ./build/bench_home_hybrid --numeric-capture-selftest "$(mktemp -d)"
      - name: Segment failover gate (fresh fencing, checkpoint replay)
        working-directory: colibri/c
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install safetensors huggingface_hub transformers
          make segment-edge-library -j"$(nproc)"
          python3 tools/make_olmoe_tiny.py --output olmoe_tiny_src --force
          python3 tools/make_edge_tiny_tokenizer.py olmoe_tiny_src --vocab-size 128
          python3 tools/convert_olmoe_merged.py --model olmoe_tiny_src --out olmoe_tiny_merged --min-free-gb 0
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-olmoe-checkpoint
          path: colibri/c/olmoe_tiny_merged/*
          retention-days: 3
      - name: V4.1 resident boundary, budgets and isolated sessions
        working-directory: lumabri
        run: |
          make test-v41-range ENGINE=../colibri/c
          make test-v41-transport-existing test-v41-abi-existing test-v41-memory-existing ENGINE=../colibri/c
          cc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -I. -Ibuild -I../colibri/c tests/c/test_v41_range.c -o build/test_v41_range_san -lm
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ./build/test_v41_range_san build/v41-tiny
          cc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -I. -Ibuild -I../colibri/c tests/c/test_v41_transport.c lumabri_segment.c -o build/test_v41_transport_san -lm
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ./build/test_v41_transport_san build/v41-tiny
          cc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -I. -Ibuild -I../colibri/c tests/c/test_v41_abi.c ../colibri/c/segment_runtime.c ../colibri/c/edge_runtime.c -o build/test_v41_abi_san -lm
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ./build/test_v41_abi_san build/v41-tiny
          make household ENGINE=../colibri/c -j3
          python3 tests/integration/v41_product_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-v41-boundary-checkpoint
          path: lumabri/build/v41-tiny/*
          retention-days: 3
      - name: Segment failover gate — run
        working-directory: lumabri
        run: |
          make tracker segment_node segment_chat test_backend_routes ENGINE=../colibri/c -j"$(nproc)"
          OLMOE_EDGE_MODEL=../colibri/c/olmoe_tiny_merged \
          SEGMENT_NODE_BIN=./segment_node SEGMENT_CHAT_BIN=./segment_chat \
            bash ./tests/integration/segment_failover_test.sh
          OLMOE_EDGE_MODEL=../colibri/c/olmoe_tiny_merged \
          SEGMENT_NODE_BIN=./segment_node SEGMENT_CHAT_BIN=./segment_chat \
            bash ./tests/integration/segment_priority_test.sh
      - name: Household TUI — approvals through real Segment generation
        working-directory: lumabri
        run: |
          ./test_backend_routes
          make test_segment_close ENGINE=../colibri/c
          ./test_segment_close
          python3 tests/integration/backend_policy_test.py
          python3 tests/integration/household_doctor_test.py
          test "$(OMP_NUM_THREADS=1 ./segment_node --thread-capacity)" = 1
          test "$(OMP_NUM_THREADS=4 OMP_THREAD_LIMIT=1 ./segment_node --thread-capacity)" = 1
          mkdir -p build/home-flow-models
          cp -a ../colibri/c/olmoe_tiny_merged build/home-flow-models/olmoe-tiny
          python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models
          python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --keep-requester
          make test_hosted_sessions
          LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --keep-requester --multi-model --sessions 2
          for sessions in 1 2 4 8; do
            python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --keep-requester --sessions "$sessions" --measure-sessions
          done
          (
            mv segment_chat segment_chat.real
            trap 'mv -f segment_chat.real segment_chat' EXIT
            python3 tests/integration/recovery_proxy_install_test.py
            python3 tests/integration/recovery_codec_proxy.py --install segment_chat
            # Long-lived idle replicas need the owned-payload lock contract,
            # not a hope that the shared runner never compresses a process.
            # The flow asserts effective locks on every prepared engine.
            LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --keep-requester --multi-model --sessions 1 --api --replicas --recovery
            LUMABRI_TEST_BROWSER=1 LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --keep-requester --multi-model --sessions 4 --api --replicas --recovery --portfolio-policy
            LUMABRI_TEST_BROWSER=1 LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint complete --api-prepare --donor-policy --donor-ram-gb 1.5 --sessions 2 --elastic --elastic-recovery
          )
          for outcome in complete reject cancel; do
            python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint "$outcome" --donor-ram-gb 1 --sessions 2
            LUMABRI_TEST_BROWSER=1 python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint "$outcome" --api-prepare --donor-ram-gb 1 --sessions 2
          done
          LUMABRI_TEST_BROWSER=1 LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint complete --api-prepare --donor-ram-gb 2 --sessions 2 --placement-comparison
          LUMABRI_TEST_KUBERNETES=1 LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint complete --api-prepare --donor-ram-gb 1.5 --sessions 2 --soak-seconds 10
          LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint complete --api-prepare --headless-donors --donor-ram-gb 1.5 --sessions 2
          LUMABRI_RESIDENCY_POLICY=engine-locked python3 tests/integration/household_service_flow_test.py --models-dir build/home-flow-models --joint complete --api-prepare --donor-ram-gb 1.5 --sessions 2 --https-nginx "$LUMABRI_TEST_NGINX"
          make segment_budget_probe
          python3 tests/integration/segment_physical_budget_test.py
          python3 tests/integration/memlock_preflight_test.py build/home-flow-models/olmoe-tiny
          python3 tests/integration/planner_tensor_contract_test.py --family olmoe --model build/home-flow-models/olmoe-tiny
          make swarm_probe
          python3 tests/integration/home_flow_test.py --models-dir build/home-flow-models --repeat-cached --clear-cached --expect-metrics --expect-calibration
          python3 tests/integration/home_flow_test.py --models-dir build/home-flow-models --kill-donor
          python3 tests/integration/home_flow_test.py --models-dir build/home-flow-models --expect-selected-no-fit
      - name: Same greedy tokens with one and two real Segment ranges
        working-directory: lumabri
        run: |
          SPLIT_MODEL_DIR=build/home-flow-models/olmoe-tiny \
          SPLIT_THREADS=2 SPLIT_CONTEXT=128 SPLIT_ROUNDS=2 \
            bash tests/integration/segment_split_test.sh
      - name: Qwen hybrid memory contract — real int8 and grouped int4
        working-directory: lumabri
        run: |
          python3 ../colibri/c/tools/make_qwen36_tiny.py --out build/qwen36-hf --ref-mode full --emit-ref build/qwen36-ref.json
          python3 ../colibri/c/tools/convert_qwen36.py --model build/qwen36-hf --out build/qwen-int8/qwen36-tiny --ebits 8 --no-readme
          python3 ../colibri/c/tools/convert_qwen36.py --model build/qwen36-hf --out build/qwen-int4/qwen36-tiny --ebits 4 --gs 16 --no-readme
          python3 ../colibri/c/tools/make_edge_tiny_tokenizer.py build/qwen-int8/qwen36-tiny --vocab-size 320
          python3 ../colibri/c/tools/make_edge_tiny_tokenizer.py build/qwen-int4/qwen36-tiny --vocab-size 320
          python3 tests/integration/planner_tensor_contract_test.py --family qwen36 --model build/qwen-int8/qwen36-tiny
          python3 tests/integration/planner_tensor_contract_test.py --family qwen36 --model build/qwen-int4/qwen36-tiny
          python3 tests/integration/prepare_qwen_edge_oracle.py --source ../colibri/c/tests/test_edge_adapters_real.c --output build/edge-fixture-oracle.c --tokenizer build/qwen-int8/qwen36-tiny/tokenizer.json --tokenizer build/qwen-int4/qwen36-tiny/tokenizer.json
          cc -O2 -fopenmp -pthread -I../colibri/c/tests build/edge-fixture-oracle.c build/segment-hybrid-colibri/build/segment/libcolibri_segment_edge.a -o build/qwen-edge-oracle -lm
          OMP_NUM_THREADS=2 build/qwen-edge-oracle qwen36 build/qwen-int8/qwen36-tiny build/qwen36-ref.json 3
          python3 tests/integration/home_flow_test.py --models-dir build/qwen-int8
          python3 tests/integration/home_flow_test.py --models-dir build/qwen-int4 --kill-donor
          SPLIT_MODEL_DIR=build/qwen-int4/qwen36-tiny SPLIT_ENGINE=qwen36 SPLIT_MODEL=qwen-int4 SPLIT_ROUNDS=1 SPLIT_THREADS=2 SPLIT_TOKENS=8 PORT=8940 bash tests/integration/segment_split_test.sh
          OLMOE_EDGE_MODEL=build/home-flow-models/olmoe-tiny OLMOE_EDGE_REF=../colibri/c/olmoe_tiny_src/ref_olmoe.json bash tests/integration/segment_relay_test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-qwen36-checkpoint
          path: lumabri/build/qwen-int4/qwen36-tiny/*
          retention-days: 3
      - name: Inkling memory contract — float oracle and packed int4
        working-directory: lumabri
        run: |
          python3 -m pip install transformers==5.16.1
          python3 tests/integration/prepare_inkling_fixture.py --engine ../colibri/c --out build/inkling-contract
          make segment_budget_probe
          python3 tests/integration/planner_tensor_contract_test.py --family inkling --model build/inkling-contract/int4/inkling-tiny
